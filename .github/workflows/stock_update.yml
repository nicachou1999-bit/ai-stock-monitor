name: Stock Update v2

on:
  schedule:
    # 平日台北 09:03-13:43（UTC 01:00-05:59）每20分鐘排一次。
    - cron: '3,23,43 1-5 * * 1-5'
    # 收盤後（台北 13:35 / 14:35 / 15:35）多排幾次，增加被執行的機會
    - cron: '35 5,6,7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-loop
  cancel-in-progress: false

env:
  UPDATE_TRIGGER_TOKEN: ${{ secrets.UPDATE_TRIGGER_TOKEN }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch price and update site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          timeout 60 git pull --rebase --autostash origin main || true

          # 先刪掉舊的 dashboard.html，避免 main.py 失敗時又把舊頁面複製成 index.html
          rm -f dashboard.html

          # 不再吞掉錯誤：main.py 出錯，這一步會直接變紅燈並顯示原因
          timeout 120 python main.py --no-browser

          test -s dashboard.html
          cp dashboard.html index.html

          git add index.html last_data.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "update: $(date +'%Y-%m-%d %H:%M')"
            git push || (git pull --rebase origin main && git push)
          fi
