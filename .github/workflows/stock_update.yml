name: Stock Update v2

on:
  schedule:
    # 平日台北 09:03-13:43（UTC 01:00-05:59）每20分鐘排一次。
    # 實測（2026-09-11 起 39 個平日）：GitHub 每天只會實際執行其中 1 次，時間落在台北 13:44-15:47，
    # 一律在收盤後，所以每天至少有一次收盤後更新；盤中更新靠 workflow_dispatch 觸發。
    - cron: '3,23,43 1-5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-loop
  cancel-in-progress: false

env:
  UPDATE_TRIGGER_TOKEN: ${{ secrets.UPDATE_TRIGGER_TOKEN }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch price and update site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          timeout 60 git pull --rebase --autostash origin main || true
          timeout 120 python main.py --no-browser || echo "run failed, will retry next cycle"
          cp dashboard.html index.html 2>/dev/null || echo "no dashboard.html produced"
          git add index.html last_data.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "update: $(date +'%Y-%m-%d %H:%M')"
            timeout 60 git push || echo "push failed, will retry next cycle"
          fi
