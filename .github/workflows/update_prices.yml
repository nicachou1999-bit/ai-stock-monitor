name: Update Stock Prices

on:
  schedule:
    # 平日台北 09:00-14:00（UTC 01:00-05:59），降低觸發頻率(每20分鐘)並錯開整點，
    # 避免過於密集的排程造成GitHub Actions隊列壅塞或被判定為異常高頻而延遲
    - cron: '3,23,43 1-5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-loop
  cancel-in-progress: false

env:
  UPDATE_TRIGGER_TOKEN: ${{ secrets.UPDATE_TRIGGER_TOKEN }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch price and update site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          timeout 60 git pull --rebase --autostash origin main || true
          timeout 120 python main.py --no-browser || echo "run failed, will retry next cycle"
          cp dashboard.html index.html 2>/dev/null || echo "no dashboard.html produced"
          git add index.html last_data.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "update: $(date +'%Y-%m-%d %H:%M')"
            timeout 60 git push || echo "push failed, will retry next cycle"
          fi
